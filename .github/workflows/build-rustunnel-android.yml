# Собирает клиент Rustunnel под Android (arm64) и выкладывает его в Releases вашего репозитория.
# Как пользоваться: положите этот файл в свой репозиторий как .github/workflows/build-rustunnel-android.yml,
# откройте вкладку Actions > "Build rustunnel for Android" > Run workflow.
# На выходе в Releases будут librustunnel.so (для jniLibs) и rustunnel-android-arm64.tar.gz (для ссылки в приложении).
name: Build rustunnel for Android

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег joaoh82/rustunnel"
        default: "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: joaoh82/rustunnel
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build client
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --release -p rustunnel-client

      - name: Package
        run: |
          mkdir out
          cp target/aarch64-linux-android/release/rustunnel out/librustunnel.so
          tar czf out/rustunnel-android-arm64.tar.gz -C target/aarch64-linux-android/release rustunnel

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rustunnel-android-${{ github.run_number }}
          name: rustunnel for Android (build ${{ github.run_number }})
          files: |
            out/librustunnel.so
            out/rustunnel-android-arm64.tar.gz
