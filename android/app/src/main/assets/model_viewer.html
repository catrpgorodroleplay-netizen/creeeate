<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent !important; 
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #container { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
            background: transparent !important;
            pointer-events: none;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            background: transparent !important;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
            pointer-events: none;
            text-align: center;
        }
        #loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00CCFF;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">
        <div class="spinner"></div>
        <div>Загрузка модели...</div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        const container = document.getElementById('container');
        const loadingDiv = document.getElementById('loading');
        
        // Парсим параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const modelPath = urlParams.get('model') || '';
        const autoRotate = urlParams.get('rotate') !== 'false';
        
        // Создаем сцену с прозрачным фоном
        const scene = new THREE.Scene();
        scene.background = null;
        
        // Камера
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3);
        camera.lookAt(0, 0.5, 0);
        
        // Рендерер с прозрачностью
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            preserveDrawingBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(3, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.5);
        fillLight.position.set(-3, 2, -3);
        scene.add(fillLight);
        
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
        rimLight.position.set(0, -2, 3);
        scene.add(rimLight);
        
        // Контролы для вращения
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = 2.0;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.target.set(0, 0.5, 0);
        controls.update();
        
        // Загрузка модели
        let model = null;
        let mixer = null;
        let animationActions = [];
        let clock = new THREE.Clock();
        
        if (modelPath) {
            loadingDiv.style.display = 'block';
            const loader = new GLTFLoader();
            
            // Пробуем загрузить модель
            loader.load(
                modelPath,
                (gltf) => {
                    model = gltf.scene;
                    
                    // Настраиваем модель
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material) {
                                node.material.transparent = true;
                                node.material.opacity = 1.0;
                                // Добавляем небольшой свечение
                                if (node.material.roughness !== undefined) {
                                    node.material.roughness = 0.3;
                                }
                                if (node.material.metalness !== undefined) {
                                    node.material.metalness = 0.1;
                                }
                            }
                        }
                    });
                    
                    // Центрируем модель
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    // Масштабируем если нужно
                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 2.5) {
                        const scale = 2.5 / maxDim;
                        model.scale.multiplyScalar(scale);
                    }
                    
                    model.position.sub(center);
                    model.position.y += 0.5;
                    
                    scene.add(model);
                    
                    // Анимации
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach((clip) => {
                            const action = mixer.clipAction(clip);
                            action.play();
                            animationActions.push(action);
                        });
                        console.log('Анимаций загружено:', gltf.animations.length);
                    } else {
                        console.log('Анимаций нет, модель статична');
                    }
                    
                    loadingDiv.style.display = 'none';
                },
                (xhr) => {
                    // Прогресс загрузки
                    if (xhr.total > 0) {
                        const progress = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingDiv.querySelector('div:last-child').textContent = `Загрузка: ${progress}%`;
                    }
                },
                (error) => {
                    console.error('Ошибка загрузки модели:', error);
                    loadingDiv.innerHTML = '❌ Ошибка загрузки модели';
                    loadingDiv.style.color = '#ff4444';
                }
            );
        } else {
            // Если нет модели, показываем тестовую сферу
            const geometry = new THREE.SphereGeometry(0.8, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00CCFF,
                transparent: true,
                opacity: 0.8,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x00CCFF,
                emissiveIntensity: 0.1
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.y = 0.5;
            scene.add(sphere);
            
            // Добавляем вращающуюся геометрию вокруг
            const ringGeo = new THREE.TorusGeometry(0.6, 0.03, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({ 
                color: 0x00CCFF, 
                transparent: true, 
                opacity: 0.5,
                emissive: 0x00CCFF,
                emissiveIntensity: 0.2
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 0.5;
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
            
            model = ring;
        }
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        
        // Сообщаем что готово
        setTimeout(() => {
            console.log('3D Viewer готов');
        }, 100);
    </script>
</body>
</html>
